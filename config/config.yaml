# RazorShield Configuration
# All experiments must use these values for reproducibility.

random_seed: 42

data:
  n_samples: 50000
  start_date: "2024-01-01"
  end_date:   "2025-06-30"
  output_path:   "data/raw/orders_synthetic.csv"
  processed_dir: "data/processed"
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15

model:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    class_weight: "balanced"

  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 15
    class_weight: "balanced"
    n_jobs: -1

  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    n_jobs: -1
    verbosity: -1

cost:
  rto_cost:          350   # ₹ per undetected RTO (shipping + reverse logistics + lost margin)
  verification_cost:  30   # ₹ per flagged order (ops/customer friction cost)

risk_thresholds:
  low_max:    0.30
  medium_max: 0.70
